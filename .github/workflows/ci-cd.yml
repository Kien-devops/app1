name: ci-cd

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'app1-production' || format('app1-{0}', github.ref) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    name: Detect changed components
    uses: ./.github/workflows/detect-changes.yml

  test_frontend:
    name: Test frontend
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    uses: ./.github/workflows/test-service.yml
    with:
      component: frontend
      directory: frontend

  test_auth:
    name: Test auth-service
    needs: detect
    if: needs.detect.outputs.auth == 'true'
    uses: ./.github/workflows/test-service.yml
    with:
      component: auth-service
      directory: services/auth-service

  test_user:
    name: Test user-service
    needs: detect
    if: needs.detect.outputs.user == 'true'
    uses: ./.github/workflows/test-service.yml
    with:
      component: user-service
      directory: services/user-service

  test_product:
    name: Test product-service
    needs: detect
    if: needs.detect.outputs.product == 'true'
    uses: ./.github/workflows/test-service.yml
    with:
      component: product-service
      directory: services/product-service

  build_frontend:
    name: Build, scan, and publish frontend
    needs: [detect, test_frontend]
    if: needs.detect.outputs.frontend == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-publish-service.yml
    with:
      component: frontend
      dockerfile: frontend/Dockerfile
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  build_auth:
    name: Build, scan, and publish auth-service
    needs: [detect, test_auth]
    if: needs.detect.outputs.auth == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-publish-service.yml
    with:
      component: auth-service
      dockerfile: services/auth-service/Dockerfile
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  build_user:
    name: Build, scan, and publish user-service
    needs: [detect, test_user]
    if: needs.detect.outputs.user == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-publish-service.yml
    with:
      component: user-service
      dockerfile: services/user-service/Dockerfile
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  build_product:
    name: Build, scan, and publish product-service
    needs: [detect, test_product]
    if: needs.detect.outputs.product == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-publish-service.yml
    with:
      component: product-service
      dockerfile: services/product-service/Dockerfile
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  deploy:
    name: Deploy changed components to K3s
    needs:
      - detect
      - build_frontend
      - build_auth
      - build_user
      - build_product
    if: >-
      ${{
        !cancelled() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        (needs.detect.outputs.deploy_frontend == 'true' ||
         needs.detect.outputs.deploy_auth == 'true' ||
         needs.detect.outputs.deploy_user == 'true' ||
         needs.detect.outputs.deploy_product == 'true' ||
         needs.detect.outputs.platform == 'true') &&
        (needs.detect.outputs.frontend != 'true' || needs.build_frontend.result == 'success') &&
        (needs.detect.outputs.auth != 'true' || needs.build_auth.result == 'success') &&
        (needs.detect.outputs.user != 'true' || needs.build_user.result == 'success') &&
        (needs.detect.outputs.product != 'true' || needs.build_product.result == 'success')
      }}
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-service.yml
    with:
      frontend: ${{ needs.detect.outputs.deploy_frontend == 'true' }}
      auth: ${{ needs.detect.outputs.deploy_auth == 'true' }}
      user: ${{ needs.detect.outputs.deploy_user == 'true' }}
      product: ${{ needs.detect.outputs.deploy_product == 'true' }}
      platform: ${{ needs.detect.outputs.platform == 'true' }}
      frontend_image_published: ${{ needs.detect.outputs.frontend == 'true' }}
      auth_image_published: ${{ needs.detect.outputs.auth == 'true' }}
      user_image_published: ${{ needs.detect.outputs.user == 'true' }}
      product_image_published: ${{ needs.detect.outputs.product == 'true' }}
