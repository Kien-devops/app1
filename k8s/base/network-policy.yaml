apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-ingress
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [frontend, auth-service, user-service, product-service]
  policyTypes: [Ingress]
  ingress:
    - from:
        # kube-system is a trusted namespace in this homelab. A podSelector is
        # intentionally omitted because Kustomize label propagation would add
        # the application's part-of label and exclude the Traefik pod.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: TCP, port: 8080 }
